# Runs the DuckDB ingester alongside beszel-hub on the same docker host.
#
#   cd scripts/docker
#   cp .env.example .env      # fill in BESZEL_* (use a dedicated read-only account)
#   docker compose up -d --build
#
# Run a report on demand:
#   docker compose exec duck-ingest duck-report.sh 24 '*'
#   docker compose exec duck-ingest duckdb -readonly /data/beszel.duckdb "SELECT count(*) FROM metrics"
#
# The DuckDB file lives in the named volume `beszel_duckdata` (survives restarts).

services:
  duck-ingest:
    # Local dev: `docker compose up -d --build` builds from ./.. (the scripts/ dir).
    # Production: set DUCK_IMAGE=<registry>/beszel-duck:<tag> in .env, then
    #   `docker compose pull && docker compose up -d`  (uses the registry image; the
    #   build section is ignored because the image is already present locally).
    image: "${DUCK_IMAGE:-beszel-duck:latest}"
    build:
      context: ..                 # scripts/  (so duck-*.sh are in the build context)
      dockerfile: docker/Dockerfile
    container_name: beszel-duck-ingest
    restart: unless-stopped
    environment:
      # Point at the hub. If this container shares the hub's docker network, use the
      # internal service name + port (no TLS hop), e.g. http://beszel:8090.
      # Otherwise use the public URL.
      BESZEL_URL: "${BESZEL_URL:?}"
      BESZEL_EMAIL: "${BESZEL_EMAIL:?}"
      BESZEL_PASSWORD: "${BESZEL_PASSWORD:?}"
      GLOB: "${GLOB:-*}"
      INGEST_INTERVAL: "${INGEST_INTERVAL:-2700}"   # 45 min (loop mode)
      INGEST_MODE: "${INGEST_MODE:-loop}"           # loop (internal timer) | cron (idle; host drives)
      LOOKBACK_MIN: "${LOOKBACK_MIN:-70}"
      TZ_OFFSET: "${TZ_OFFSET:-8}"
      BESZEL_AUTH_COLLECTION: "${BESZEL_AUTH_COLLECTION:-users}"
      DUCK_DB: /data/beszel.duckdb
    volumes:
      # Host bind mount: the DuckDB file lives in ./data next to this compose file,
      # so it's visible/back-up-able and independent of the container lifecycle.
      # The entrypoint chowns it to the container user on start, so a plain
      # `mkdir data` (or letting compose create it) is enough — no manual chown.
      - ./data:/data
    # If reaching the hub over the internal docker network, join it here and set
    # BESZEL_URL=http://<hub-service>:8090 in .env. Otherwise omit `networks`.
    # networks: [beszel_default]

  # HAProxy spool loader. Independent of duck-ingest above: no hub URL/creds — it
  # only reads the NDJSON spool the hub writes (HAPROXY_DUCK_SPOOL on the hub).
  # Runs as root so it can read the hub's root-owned spool + archive closed files.
  # Report on demand: docker compose exec haproxy-duck duck-haproxy-report.sh 1 'ha-*'
  haproxy-duck:
    image: "${DUCK_IMAGE:-beszel-duck:latest}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: beszel-haproxy-duck
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/haproxy-entrypoint.sh"]
    environment:
      HAPROXY_INGEST_INTERVAL: "${HAPROXY_INGEST_INTERVAL:-300}"   # seconds between loads
      HAPROXY_RETENTION_DAYS: "${HAPROXY_RETENTION_DAYS:-14}"
      TZ_OFFSET: "${TZ_OFFSET:-8}"
      HAPROXY_DUCK_DB: /data/haproxy.duckdb
      HAPROXY_SPOOL_DIR: /spool
      HAPROXY_UI_SNAPSHOT: /data/haproxy-ui.duckdb                 # read-only copy for the UI (see haproxy-ui)
      HAPROXY_UI_SNAPSHOT_EVERY: "${HAPROXY_UI_SNAPSHOT_EVERY:-6}" # refresh every N ingest cycles (6×5min=30min)
    volumes:
      - ./haproxy-data:/data                                       # dedicated haproxy.duckdb (separate from capacity DB)
      - "${HAPROXY_SPOOL_HOST_DIR:-./haproxy-spool}:/spool"        # MUST match the hub's HAPROXY_DUCK_SPOOL host dir (rw, for archiving)

  # DuckDB official UI for the HAProxy store. Serves the read-only snapshot the
  # loader refreshes (NOT the live DB — a held UI connection blocks ingestion).
  # The UI has no auth and its frontend loads from ui.duckdb.org, so: publish only
  # on host localhost and reach it via SSH tunnel, and ensure the container has
  # outbound internet. Open http://localhost:4213 after `ssh -L 4213:localhost:4213`.
  haproxy-ui:
    image: "${DUCK_IMAGE:-beszel-duck:latest}"
    container_name: beszel-haproxy-ui
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/haproxy-ui-entrypoint.sh"]
    environment:
      HAPROXY_UI_DB: /data/haproxy-ui.duckdb
      HAPROXY_UI_PORT: "4213"
    volumes:
      - ./haproxy-data:/data                                       # same dir as haproxy-duck (reads the snapshot)
    ports:
      - "127.0.0.1:4213:4213"                                      # host-local only; reach via SSH tunnel (no auth on the UI)

# Uncomment + match the hub's network name (docker network ls) to use internal DNS:
# networks:
#   beszel_default:
#     external: true
