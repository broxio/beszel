# Reverse proxy in front of Duck-UI (browser-side DuckDB-WASM) for the HAProxy
# store. Two things behind one basic-auth + (recommended) TLS:
#   /        -> the Duck-UI app (self-contained, offline; no ui.duckdb.org)
#   /data/   -> the rolling Parquet the loader exports (queried via read_parquet)
# Same origin for both, so the browser's WASM fetch of /data/*.parquet carries the
# basic-auth credentials and needs no CORS.
#
# Create the password file (bcrypt) next to the compose, mode 644 (nginx workers
# run as the unprivileged `nginx` user; 600 -> "Permission denied" -> HTTP 500):
#   docker run --rm -it httpd:alpine htpasswd -nB admin > ui.htpasswd && chmod 644 ui.htpasswd
#
# NOTE: basic-auth over plain HTTP sends credentials in clear — terminate TLS here
# or at an upstream LB (you already front this with https://...).
server {
  listen 8080;
  server_name _;

  # Docker's embedded DNS, so the duck-ui hostname is resolved lazily (per request)
  # instead of at startup — otherwise nginx crash-loops with "host not found in
  # upstream" whenever duck-ui isn't up yet. The variable in proxy_pass forces this.
  resolver 127.0.0.11 ipv6=off valid=10s;

  auth_basic           "HAProxy DuckDB UI";
  auth_basic_user_file /etc/nginx/.htpasswd;

  # Duck-UI app
  location / {
    set $duckui        duck-ui:5522;
    proxy_pass         http://$duckui;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_read_timeout 3600s;
  }

  # Rolling Parquet exports (static). Range requests (default on) let DuckDB-WASM
  # fetch only the row-groups a query touches. Query in Duck-UI with the full URL:
  #   SELECT ... FROM read_parquet('https://<this-host>/data/haproxy_proxies.parquet')
  location /data/ {
    alias /srv/parquet/;
    autoindex on;
    add_header Cache-Control "no-cache";
  }
}
