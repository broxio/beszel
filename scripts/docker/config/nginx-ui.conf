# Reverse proxy with basic-auth in front of the (unauthenticated) DuckDB UI.
# Mounted into the ui-proxy service. The UI itself stays internal-only; this is
# the only thing that should be published.
#
# Create the password file (bcrypt) next to the compose:
#   docker run --rm httpd:alpine htpasswd -nbB admin 'YOURPASS' > ui.htpasswd
#
# NOTE: basic-auth over plain HTTP sends credentials in clear — terminate TLS here
# (add a `listen 8443 ssl;` block with certs) or front this with Caddy/Traefik for
# automatic HTTPS if the host is reachable from untrusted networks.
server {
  listen 8080;
  server_name _;

  location / {
    auth_basic           "HAProxy DuckDB UI";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass         http://haproxy-ui:4213;   # docker DNS -> socat 0.0.0.0:4213 in the UI container
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;  # the UI uses websockets
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_read_timeout 3600s;
    proxy_buffering    off;
  }
}
